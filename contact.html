<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAGR Residency — Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"
    />

    <style>
      :root {
        --gold: #c9a84c;
        --gold-light: #e8c97a;
        --gold-pale: #f5edd8;
        --deep: #0c1a2e;
        --deep2: #132338;
        --off: #f8f5f0;
        --white: #ffffff;
        --text: #1a2535;
        --muted: #6b7a8d;
        --border: rgba(201, 168, 76, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--off);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── NAVBAR ── */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 60px;
        background: rgba(12, 26, 46, 0.96);
        backdrop-filter: blur(16px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      }

      .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 30px;
        font-weight: 700;
        color: var(--white);
        text-decoration: none;
        letter-spacing: 1px;
      }
      .logo span {
        color: var(--gold);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 36px;
      }
      .nav-links a {
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.82);
        transition: color 0.25s;
      }
      .nav-links a:hover {
        color: var(--gold-light);
      }

      .nav-book {
        border: 1px solid var(--gold) !important;
        color: var(--gold) !important;
        padding: 10px 22px;
        border-radius: 2px;
        transition: all 0.3s !important;
      }
      .nav-book:hover {
        background: var(--gold) !important;
        color: var(--deep) !important;
      }

      .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
      }
      .hamburger span {
        display: block;
        width: 24px;
        height: 2px;
        background: white;
        border-radius: 2px;
        transition: 0.3s;
      }

      /* Mobile Drawer */
      .mobile-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 300;
        backdrop-filter: blur(4px);
      }
      .mobile-overlay.open {
        display: block;
      }
      .mobile-drawer {
        position: absolute;
        top: 0;
        right: 0;
        width: 78%;
        max-width: 320px;
        height: 100%;
        background: var(--deep);
        padding: 40px 28px;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .mobile-overlay.open .mobile-drawer {
        transform: translateX(0);
      }
      .drawer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .drawer-logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 26px;
        font-weight: 700;
        color: white;
      }
      .drawer-logo span {
        color: var(--gold);
      }
      .drawer-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 20px;
        cursor: pointer;
      }
      .mobile-drawer nav {
        display: flex;
        flex-direction: column;
      }
      .mobile-drawer nav a {
        display: block;
        padding: 18px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        text-decoration: none;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 500;
        transition: color 0.2s;
      }
      .mobile-drawer nav a:hover {
        color: var(--gold);
      }
      .mobile-drawer nav .m-book {
        margin-top: 24px;
        text-align: center;
        background: var(--gold);
        color: var(--deep) !important;
        border-radius: 2px;
        padding: 16px;
        font-weight: 600;
        border-bottom: none;
      }

      /* ── PAGE HERO BANNER ── */
      .page-banner {
        padding-top: 80px;
        background: var(--deep);
        text-align: center;
        padding-bottom: 70px;
        position: relative;
        overflow: hidden;
      }
      .page-banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center top,
          rgba(201, 168, 76, 0.12),
          transparent 60%
        );
        pointer-events: none;
      }
      .banner-label {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid rgba(201, 168, 76, 0.35);
        padding: 8px 20px;
        border-radius: 1px;
        margin-bottom: 20px;
        background: rgba(201, 168, 76, 0.06);
      }
      .page-banner h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 64px;
        font-weight: 600;
        color: white;
        line-height: 1.05;
        margin-bottom: 16px;
      }
      .page-banner h1 em {
        font-style: italic;
        color: var(--gold-light);
      }
      .page-banner p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 15px;
        font-weight: 300;
        max-width: 500px;
        margin: auto;
      }

      /* ── CONTACT SECTION ── */
      .contact-section {
        padding: 80px 0 100px;
        width: min(1100px, 92%);
        margin: auto;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
      }

      .contact-img img {
        width: 100%;
        border-radius: 4px;
        box-shadow: 0 24px 60px rgba(12, 26, 46, 0.15);
        display: block;
      }

      /* ── FORM BOX ── */
      .contact-box {
        background: white;
        border-radius: 4px;
        padding: 48px 44px;
        box-shadow: 0 20px 60px rgba(12, 26, 46, 0.1);
        border-top: 3px solid var(--gold);
      }

      .form-label-top {
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 500;
        margin-bottom: 10px;
        display: block;
      }

      .contact-box h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 42px;
        font-weight: 600;
        color: var(--deep);
        margin-bottom: 32px;
        line-height: 1.1;
      }

      .iti {
        width: 100%;
        margin-bottom: 16px;
      }
      .iti input {
        width: 100%;
      }
      .iti--separate-dial-code .iti__selected-flag {
        padding: 0 10px;
      }

      .form-control {
        width: 100%;
        padding: 14px 16px;
        border-radius: 2px;
        border: 1px solid #e2d9cc;
        margin-bottom: 16px;
        font-size: 14px;
        font-family: "DM Sans", sans-serif;
        outline: none;
        color: var(--text);
        background: #fdfcfa;
        transition: 0.3s ease;
      }
      .form-control::placeholder {
        color: #aaa;
      }
      .form-control:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
        background: white;
      }
      textarea.form-control {
        height: 120px;
        resize: vertical;
      }

      .btn-main {
        background: var(--deep);
        border: none;
        padding: 16px 32px;
        width: 100%;
        color: white;
        font-weight: 500;
        border-radius: 2px;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: 0.3s ease;
        font-family: "DM Sans", sans-serif;
      }
      .btn-main:hover {
        background: var(--gold);
        color: var(--deep);
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(201, 168, 76, 0.25);
      }

      /* ── FOOTER ── */
      footer {
        background: var(--deep);
        color: rgba(255, 255, 255, 0.5);
        padding: 50px 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
      }
      .footer-logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 28px;
        font-weight: 700;
        color: white;
      }
      .footer-logo span {
        color: var(--gold);
      }
      .footer-links {
        display: flex;
        gap: 28px;
      }
      .footer-links a {
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: color 0.2s;
      }
      .footer-links a:hover {
        color: var(--gold);
      }
      footer p {
        font-size: 12px;
      }

      /* ── MEDIA QUERIES ── */
      @media (max-width: 1024px) {
        .contact-grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }
      }

      @media (max-width: 768px) {
        .navbar {
          padding: 16px 20px;
        }
        .nav-links {
          display: none;
        }
        .hamburger {
          display: flex;
        }

        .page-banner h1 {
          font-size: 42px;
        }

        .contact-grid {
          display: flex;
          flex-direction: column;
          gap: 30px;
        }
        .contact-box {
          order: 1;
          padding: 28px 24px;
        }
        .contact-box h2 {
          font-size: 34px;
        }
        .contact-img {
          order: 2;
        }
        .contact-section {
          padding: 50px 0 70px;
        }

        footer {
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 40px 24px;
        }
        .footer-links {
          flex-wrap: wrap;
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="logo">VAGR <span>Residency</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="book.html" class="nav-book">Book Now</a>
      </div>
      <button class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <!-- MOBILE DRAWER -->
    <div class="mobile-overlay" id="mobileOverlay">
      <div class="mobile-drawer">
        <div class="drawer-top">
          <div class="drawer-logo">VAGR <span>Residency</span></div>
          <button class="drawer-close" id="drawerClose">
            <i class="fa fa-times"></i>
          </button>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="contact.html">Contact</a>
          <a href="book.html" class="m-book">Book Now</a>
        </nav>
      </div>
    </div>

    <!-- PAGE BANNER -->
    <div class="page-banner">
      <div class="banner-label">Get in Touch</div>
      <h1>Request a <em>Call Back</em></h1>
      <p>Our team will reach out to you personally to assist with your stay.</p>
    </div>

    <!-- CONTACT SECTION -->
    <div class="contact-section">
      <div class="contact-grid">
        <div class="contact-img">
          <img src="images/callback.png" alt="Contact VAGR Residency" />
        </div>
        <div class="contact-box">
          <span class="form-label-top">Send a Message</span>
          <h2>We'd Love to Hear From You</h2>
          <form id="callbackForm">
            <input
              id="contactName"
              class="form-control"
              placeholder="Your full name"
              required
            />
            <input
              id="contactPhone"
              class="form-control"
              type="tel"
              placeholder="Phone number"
              required
            />
            <input
              id="contactEmail"
              class="form-control"
              placeholder="Email address (optional)"
            />
            <textarea
              id="contactMessage"
              class="form-control"
              placeholder="How can we help you?"
              required
            ></textarea>
            <button type="button" id="contactBtn" class="btn-main">
              Send Message
            </button>
          </form>
          <div id="thankyou" style="margin-top: 14px; font-size: 14px"></div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-logo">VAGR <span>Residency</span></div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="book.html">Book</a>
        <a href="contact.html">Contact</a>
      </div>
      <p>© 2026 VAGR Residency. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>

    <script type="module">
      import { firebaseConfig } from "./js/config.js";
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
      } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const phoneInput = document.querySelector("#contactPhone");
      const iti = window.intlTelInput(phoneInput, {
        initialCountry: "in",
        separateDialCode: true,
        preferredCountries: ["in", "us", "gb"],
        utilsScript:
          "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js",
      });

      document
        .querySelector("#contactBtn")
        .addEventListener("click", async () => {
          const name = document.querySelector("#contactName").value.trim();
          const email = document.querySelector("#contactEmail").value.trim();
          const message = document
            .querySelector("#contactMessage")
            .value.trim();
          const dial = iti.getSelectedCountryData().dialCode;
          const national = phoneInput.value.replace(/\D/g, "");
          const phone = `+${dial}${national}`;

          if (!name || !phone || !message) {
            document.querySelector("#thankyou").innerHTML =
              `<span style="color:#dc2626">Please fill all required fields.</span>`;
            return;
          }
          try {
            await addDoc(collection(db, "contacts"), {
              name,
              phone,
              email,
              message,
              createdAt: new Date().toISOString(),
            });
            document.querySelector("#thankyou").innerHTML =
              `<span style="color:#16a34a">Message sent successfully!</span>`;
            document.querySelector("#callbackForm").reset();
            iti.setCountry("in");
          } catch (err) {
            console.error(err);
            document.querySelector("#thankyou").innerHTML =
              `<span style="color:#dc2626">Failed to send message.</span>`;
          }
        });
    </script>

    <script>
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const mobileOverlay = document.getElementById("mobileOverlay");
      const drawerClose = document.getElementById("drawerClose");
      hamburgerBtn.addEventListener("click", () =>
        mobileOverlay.classList.add("open"),
      );
      drawerClose.addEventListener("click", () =>
        mobileOverlay.classList.remove("open"),
      );
      mobileOverlay.addEventListener("click", (e) => {
        if (e.target === mobileOverlay) mobileOverlay.classList.remove("open");
      });
    </script>
  </body>
</html>
