<!-- contact.html -->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #38bdf8;
        --primary-dark: #0ea5e9;
        --primary-light: #e0f7ff;
        --white: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #d7effa;
        --bg1: #f0f9ff;
        --bg2: #dff4ff;
        --shadow: 0 15px 40px rgba(14, 165, 233, 0.12);
        --shadow-hover: 0 25px 50px rgba(14, 165, 233, 0.18);
        --radius: 28px;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f2fbff;
      }

      .bg-shape {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        opacity: 0.45;
        pointer-events: none;
      }

      .shape1 {
        width: 220px;
        height: 220px;
        background: #7dd3fc;
        top: 80px;
        left: -60px;
      }

      .shape2 {
        width: 280px;
        height: 280px;
        background: #bae6fd;
        bottom: 30px;
        right: -80px;
      }

      .wrapper {
        position: relative;
        z-index: 1;
        width: min(1200px, 92%);
        margin: auto;
        padding: 28px 0 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: var(--shadow);
        border-radius: 24px;
        padding: 18px 26px;
        margin-bottom: 42px;
      }

      .container {
        width: 85%;
        margin: auto;
        padding: 80px 0;
      }
      .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 40px;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
      }

      .logo span {
        color: var(--primary-dark);
      }

      .back-btn {
        text-decoration: none;
        color: var(--white);
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 12px 24px rgba(14, 165, 233, 0.2);
        transition: 0.3s ease;
      }

      .back-btn:hover {
        transform: translateY(-2px);
      }

      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
        align-items: center;
      }

      .contact-img img {
        width: 100%;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      }

      .contact-box {
        background: white;
        padding: 40px;
        border-radius: 25px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      .contact-box h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 40px;
        margin-bottom: 25px;
      }

      /* Make phone input full width */
      .iti {
        width: 100%;
        margin-bottom: 15px;
      }

      /* Fix input inside intl-tel-input */
      .iti input {
        width: 100%;
        padding-left: 90px !important; /* space for flag */
      }
      .iti--separate-dial-code .iti__selected-flag {
        padding: 0 10px;
      }

      /* Make all form inputs consistent */
      .form-control {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #cfeaf7;
        margin-bottom: 15px;
      }

      textarea {
        height: 120px;
      }

      .btn-main {
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        border: none;
        padding: 14px;
        width: 100%;
        color: white;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="wrapper">
      <div class="topbar">
        <div class="logo">VAGR <span>Residency</span></div>
        <a href="index.html" class="back-btn">Back to Home</a>
      </div>
    </div>
    <div class="container">
      <div class="contact-grid">
        <div class="contact-img">
          <img src="images/hotel-contact.jpg" />
        </div>

        <div class="contact-box">
          <h2>Request a Call Back</h2>

          <form id="callbackForm">
            <input
              id="contactName"
              class="form-control"
              placeholder="Name"
              required
            />

            <input
              id="contactPhone"
              class="form-control"
              type="tel"
              placeholder="Phone"
              required
            />

            <input id="contactEmail" class="form-control" placeholder="Email" />

            <textarea
              id="contactMessage"
              class="form-control"
              placeholder="Message"
              required
            ></textarea>

            <button type="button" id="contactBtn" class="btn-main">
              Send Message
            </button>
          </form>

          <div id="thankyou" style="margin-top: 10px"></div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>

    <script type="module">
      import { firebaseConfig } from "./js/config.js";
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
      } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Phone input setup
      const phoneInput = document.querySelector("#contactPhone");

      const iti = window.intlTelInput(phoneInput, {
        initialCountry: "in",
        separateDialCode: true,
        preferredCountries: ["in", "us", "gb"],
        utilsScript:
          "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js",
      });

      // Form submit
      document
        .querySelector("#contactBtn")
        .addEventListener("click", async () => {
          const name = document.querySelector("#contactName").value.trim();
          const email = document.querySelector("#contactEmail").value.trim();
          const message = document
            .querySelector("#contactMessage")
            .value.trim();

          const dial = iti.getSelectedCountryData().dialCode;
          const national = phoneInput.value.replace(/\D/g, "");
          const phone = `+${dial}${national}`;

          if (!name || !phone || !message) {
            document.querySelector("#thankyou").innerHTML =
              `<span style="color:red">Please fill all required fields.</span>`;
            return;
          }

          try {
            await addDoc(collection(db, "contacts"), {
              name,
              phone,
              email,
              message,
              createdAt: new Date().toISOString(),
            });

            document.querySelector("#thankyou").innerHTML =
              `<span style="color:green">Message sent successfully!</span>`;

            document.querySelector("#callbackForm").reset();

            iti.setCountry("in");
          } catch (err) {
            console.error(err);

            document.querySelector("#thankyou").innerHTML =
              `<span style="color:red">Failed to send message.</span>`;
          }
        });
    </script>
  </body>
</html>
