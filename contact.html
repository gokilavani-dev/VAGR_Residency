<head>

<!-- Font Awesome -->

<!-- AOS -->

<!-- intl-tel-input CSS -->

<!-- External CSS -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/contact.css">


</head>
<body>

<!-- CONTACT FORM -->
<div class="contact-container">
  <div class="contact-image">
    <img src="images/callback.png" alt="Contact">
  </div>
  <div class="contact-form-area">
<form id="callbackForm">
  <h2>Request a Call Back</h2>

  <label>Name:<input id="contactName" name="name" required></label>

  <label>Phone:
    <input id="contactPhone" name="phone" type="tel" placeholder="Enter phone number" required>
  </label>

  <label>Email:<input id="contactEmail" name="email"></label>
  <label>Message:<textarea id="contactMessage" name="message" required></textarea></label>
  <button type="button" id="contactBtn">Call Back!</button>
</form>
<div id="thankyou"></div>
  </div>
</div>

<!-- intl-tel-input JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>

<!-- Add this at the bottom of your contact.html, before </body> -->

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  // --- Firebase Config ---
  const firebaseConfig = {
    apiKey: "AIzaSyD-6dIVCrbi2PoQXr5JDQwG6mnDTMIqYGo",
    authDomain: "vagr-residency.firebaseapp.com",
    projectId: "vagr-residency",
    storageBucket: "vagr-residency.firebasestorage.app",
    messagingSenderId: "906241851144",
    appId: "1:906241851144:web:1322d674bd92f62aab36bd"
  };

  // --- Initialize Firebase ---
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  // Initialize phone input with flags and dial codes
const phoneInput = document.querySelector("#contactPhone");
const iti = window.intlTelInput(phoneInput, {
    initialCountry: "in",           // Default country India
    separateDialCode: true,         // Show country code separately
    preferredCountries: ["in","us","gb"],
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
});

  // --- Contact Form Submission ---
  document.querySelector("#contactBtn").addEventListener("click", async () => {
    const name = document.querySelector("#contactName").value.trim();
    const email = document.querySelector("#contactEmail").value.trim();
    const message = document.querySelector("#contactMessage").value.trim();

    // Format phone number
    const dial = iti.getSelectedCountryData().dialCode;
    const national = phoneInput.value.replace(/\D/g, "");
    const phone = `+${dial}${national}`;

    // Validate required fields
    if (!name || !phone || !message) {
      document.querySelector("#thankyou").innerHTML = `<span style="color:red">Please fill all required fields.</span>`;
      return;
    }

    try {
      // Add document to Firestore
      await addDoc(collection(db, "contacts"), {
        name,
        phone,
        email,
        message,
        createdAt: new Date().toISOString()
      });

      // Show success
      document.querySelector("#thankyou").innerHTML = `<span style="color:green">Message sent successfully!</span>`;
      document.querySelector("#callbackForm").reset();

      // Reset phone input to default country
      try { iti.setCountry("in"); } catch(e){/*ignore*/}
    } catch (err) {
      console.error("Error saving contact:", err);
      document.querySelector("#thankyou").innerHTML = `<span style="color:red">Failed to send message. Try again.</span>`;
    }
  });
</script>
</body>
</html>
