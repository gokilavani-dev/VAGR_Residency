<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vagr Residency</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- AOS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  
  <!-- intl-tel-input CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
  
  <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css"/>
    
    <link rel="stylesheet" href="css/book.css"/>
    

  
  
   <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
   
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="images/vagr_logo.png" alt="Vagr Residency Logo" class="logo me-2">
      <h1 class="mb-0">Vagr Residency</h1>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#aboutus">About us</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link book active" href="book.html">Booking</a></li>
      </ul>
    </div>
  </div>
</nav>


  <!-- BOOKING FORM -->
  <div class="booking-container">

    <!-- LEFT SIDE (FORM) -->
    <div class="booking-card" data-aos="fade-right">
        <div class="booking-box">
            <h2>Book Your Stay</h2>
            <form id="bookingForm">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input id="name" type="text" placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label>Phone:</label>
                    <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label>Rooms</label>
                    <select id="rooms">
                        <option value="1">1 Room</option>
                        <option value="2">2 Rooms</option>
                        <option value="3">3 Rooms</option>
                        <option value="4">4 Rooms</option>
                        <option value="5">5 Rooms</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Room Category</label>
                    <select id="roomCategory">
                        <option value="large">Large(Double-Cot)</option>
                        <option value="small">Small(Single-Cot)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>AC / Non-AC</label>
                    <select id="roomType">
                        <option value="ac">AC Room</option>
                        <option value="nonac">Non-AC Room</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Total Price</label>
                    <input id="totalPrice" type="text" disabled>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Adults</label>
                        <input id="adults" type="number" min="1" value="1">
                    </div>
                    <div class="col">
                        <label>Children</label>
                        <input id="children" type="number" min="0" value="0">
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col">
                        <label>Check-in</label>
                        <input id="checkin" type="date">
                    </div>
                    <div class="col">
                        <label>Check-out</label>
                        <input id="checkout" type="date">
                    </div>
                </div>

                <button type="button" id="checkBtn" class="btn-main">Check Availability</button>
                <button type="button" id="bookBtn" class="btn-main mt-2">Book Now</button>
                <div id="bookingResult"></div>

                <div class="cancel-box">
                    <button type="button" id="toggleCancel" class="cancel-toggle">Cancel a Booking</button>
                    <div id="cancelArea" class="cancel-area">
                        <input id="cancelPhone" type="text" placeholder="Phone used for booking"/>
                        <label>Check-in</label>
                        <input id="cancelCheckin" type="date"/>
                        <button id="cancelBtn" type="button" class="btn-cancel">Submit Cancel</button>
                        <div id="cancelMessage"></div>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- RIGHT SIDE (IMAGE) -->
    <div class="booking-image" data-aos="fade-left">
        <img src="images/booking.png" alt="Room Image">
    </div>

</div>


  <!-- intl-tel-input JS -->
<script src="js/book.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc,
    orderBy, limit, runTransaction
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {
  // ---------------- PRICE CHART ----------------
  const priceChart = {
    large:   { ac: 2300, nonac: 2000 },
    small:   { ac: 1800, nonac: 1500 }
  };

  const roomsEl = document.querySelector("#rooms");
  const categoryEl = document.querySelector("#roomCategory");
  const typeEl = document.querySelector("#roomType");
  const totalPriceEl = document.querySelector("#totalPrice");

  function updatePrice() {
    const rooms = parseInt(roomsEl.value) || 1;
    const category = categoryEl.value;
    const type = typeEl.value;

    const basePrice = priceChart[category][type];
    const total = rooms * basePrice;

    totalPriceEl.value = "₹" + total;
  }

  // Listeners
  [roomsEl, categoryEl, typeEl].forEach(el => el.addEventListener("change", updatePrice));

  // Initialize
  updatePrice();
  const toggleCancelBtn = document.getElementById("toggleCancel");
  const cancelArea = document.getElementById("cancelArea");

  // make sure it starts hidden
  cancelArea.style.display = "none";

  toggleCancelBtn.addEventListener("click", () => {
    const isVisible = cancelArea.style.display === "block";

    cancelArea.style.display = isVisible ? "none" : "block";
    toggleCancelBtn.textContent = isVisible
      ? "Cancel a Booking"
      : "Hide Cancel Form";
  });

  // ---------------- FIREBASE ----------------
  
  const firebaseConfig = {
    apiKey: "AIzaSyAHGBdgyg21jfj_2uHHuPIIo2GE1oPf1DU",
    authDomain: "vagr-residency.firebaseapp.com",
    projectId: "vagr-residency",
    storageBucket: "vagr-residency.firebasestorage.app",
    messagingSenderId: "906241851144",
    appId: "1:906241851144:web:1322d674bd92f62aab36bd"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------------- BOOKING ID GENERATOR ----------------
  async function generateBookingId() {
    const bookingsRef = collection(db, "booking");

    const newNumber = await runTransaction(db, async (transaction) => {
      const q = query(bookingsRef, orderBy("number", "desc"), limit(1));
      const snap = await getDocs(q);
      const lastNumber = snap.empty ? 0 : snap.docs[0].data().number || 0;
      return lastNumber + 1;
    });

    const padded = String(newNumber).padStart(4, "0");
    const year = new Date().getFullYear();
    return { bookingId: `VAGR-${year}-${padded}`, number: newNumber };
  }

  // ---------------- PHONE INPUT ----------------
  const phoneInput = document.querySelector("#phone");
  const cancelPhoneInput = document.querySelector("#cancelPhone");

  const iti = window.intlTelInput(phoneInput, {
    initialCountry: "in",
    separateDialCode: true,
    preferredCountries: ["in","us","gb"],
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
  });

  const itiCancel = window.intlTelInput(cancelPhoneInput, {
    initialCountry: "in",
    separateDialCode: true,
    preferredCountries: ["in","us","gb"],
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
  });

  // ---------------- BOOK NOW ----------------
  document.querySelector("#bookBtn").addEventListener("click", async () => {
    const name = document.querySelector("#name").value.trim();
    const rooms = parseInt(roomsEl.value) || 1;
    const adults = parseInt(document.querySelector("#adults").value) || 1;
    const children = parseInt(document.querySelector("#children").value) || 0;
    const checkin = document.querySelector("#checkin").value;
    const checkout = document.querySelector("#checkout").value;
    const roomCategory = categoryEl.value;
    const roomType = typeEl.value;

    // Format phone
    const dial = iti.getSelectedCountryData().dialCode;
    const national = phoneInput.value.replace(/\D/g, "");
    const phone = `+${dial} ${national}`;

    if (!name || !phone || !checkin || !checkout) {
      document.querySelector("#bookingResult").innerHTML =
        `<span style="color:red">Please fill all required fields.</span>`;
      return;
    }

    // --- SIMPLE AVAILABILITY CHECK FOR BOTH ROOM TYPES & DISABLE OPTIONS --- //
const totalLarge = 5;
const totalSmall = 6;

// Fetch bookings for these dates
const q = query(
  collection(db, "booking"),
  where("checkin", "<", checkout),
  where("checkout", ">", checkin)
);
const snap = await getDocs(q);

// Count booked rooms
let bookedLarge = 0;
let bookedSmall = 0;

snap.forEach(d => {
  const data = d.data();
  if (data.roomCategory === "large") bookedLarge += Number(data.rooms || 0);
  if (data.roomCategory === "small") bookedSmall += Number(data.rooms || 0);
});

// Calculate availability
const availableLarge = totalLarge - bookedLarge;
const availableSmall = totalSmall - bookedSmall;

// Build message
let msg = "";

if (availableLarge > 0) {
  msg += `Large Rooms Available: <b>${availableLarge}</b><br>`;
} else {
  msg += `<span style="color:red">Large Rooms Fully Booked</span><br>`;
}

if (availableSmall > 0) {
  msg += `Small Rooms Available: <b>${availableSmall}</b>`;
} else {
  msg += `<span style="color:red">Small Rooms Fully Booked</span>`;
}

// Show availability
document.querySelector("#bookingResult").innerHTML = `<div>${msg}</div>`;

// ---- DISABLE ROOM OPTIONS BASED ON AVAILABILITY ---- //
const roomCategoryEl = document.getElementById("roomCategory");

[...roomCategoryEl.options].forEach(opt => {
  if (opt.value === "large") {
    opt.disabled = availableLarge <= 0;
  }
  if (opt.value === "small") {
    opt.disabled = availableSmall <= 0;
  }
});

    const basePrice = priceChart[roomCategory][roomType];
    const totalAmount = rooms * basePrice * 100;

    const options = {
      key: "YOUR_RAZORPAY_KEY_ID",
      amount: totalAmount,
      currency: "INR",
      name: "Vagr Residency",
      description: "Room Booking",
      handler: async function (response) {
        const { bookingId, number } = await generateBookingId();
        await addDoc(collection(db, "booking"), {
          bookingId, number, name, phone, rooms, adults, children,
          checkin, checkout, roomCategory, roomType,
          pricePerRoom: basePrice,
          price: totalAmount/100,
          paymentId: response.razorpay_payment_id,
          status: "Booked",
          createdAt: new Date().toISOString()
        });

        document.querySelector("#bookingResult").innerHTML =
          `<span style="color:green">Booking Successful! Your Booking ID: <b>${bookingId}</b></span>`;

        document.getElementById("bookingForm").reset();
        updatePrice();
      },
      prefill: { name, contact: phone },
      theme: { color: "#ff7f00" },
    };

    const rzp = new Razorpay(options);
    rzp.open();
  });

  // ---------------- CANCEL BOOKING ----------------
  document.querySelector("#cancelBtn").addEventListener("click", async () => {
    const cCheckin = document.querySelector("#cancelCheckin").value;
    const dial = itiCancel.getSelectedCountryData().dialCode;
    const national = cancelPhoneInput.value.replace(/\D/g, "");
    const formattedPhone = `+${dial} ${national}`;

    if (!formattedPhone || !cCheckin) {
      document.querySelector("#cancelMessage").innerHTML = `<span style="color:red">Enter phone & check-in date.</span>`;
      return;
    }

    try {
      const q = query(collection(db, "booking"),
        where("phone", "==", formattedPhone),
        where("checkin", "==", cCheckin)
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        document.querySelector("#cancelMessage").innerHTML = `<span style="color:red">No booking found for this phone and date.</span>`;
        return;
      }

      const deletes = snap.docs.map(d => deleteDoc(doc(db, "booking", d.id)));
      await Promise.all(deletes);

      document.querySelector("#cancelMessage").innerHTML = `<span style="color:green">Booking cancelled successfully.</span>`;
      cancelPhoneInput.value = "";
      document.querySelector("#cancelCheckin").value = "";
    } catch(err) {
      console.error(err);
      document.querySelector("#cancelMessage").innerHTML = `<span style="color:red">Error cancelling booking.</span>`;
    }
  });
});

AOS.init({ once: true, duration: 1100 });
</script>

</body>
</html>
